<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minute to Win It - Live Stage TV Display</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Teko:wght@600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      overflow: hidden;
      margin: 0;
      background: #020617;
    }

    .spectator-container {
      display: grid;
      grid-template-columns: 420px 1fr;
      height: 100vh;
      width: 100vw;
      padding: 24px;
      box-sizing: border-box;
      gap: 24px;
    }

    .giant-clock-tv {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 3px solid var(--sky-blue);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-shadow: var(--shadow-neon);
    }

    .clock-digits-tv {
      font-family: var(--font-display);
      font-size: 7.5rem;
      font-weight: 900;
      color: #fef08a;
      letter-spacing: 3px;
      text-shadow: 0 0 35px rgba(254, 240, 138, 0.6);
    }

    .challenge-card-tv {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 3px solid var(--glass-border);
      border-radius: 24px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
  </style>
</head>
<body data-theme="runway-blue">
  <div class="stage-spotlight-left"></div>
  <div class="stage-spotlight-right"></div>

  <div class="spectator-container">
    <!-- Left: 60-second Clock TV -->
    <div class="giant-clock-tv">
      <div style="font-family: var(--font-display); font-size: 1.8rem; color: #ffffff; letter-spacing: 2px;">
        STAGE COUNTDOWN
      </div>
      <div class="clock-digits-tv" id="clock-display-tv">01:00</div>
      <div style="font-size: 2rem;" id="lives-display-tv">❤️❤️❤️</div>
    </div>

    <!-- Right: Active Challenge & Rules TV -->
    <div class="challenge-card-tv">
      <div>
        <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 12px;">
          <span style="font-size: 3rem;">⏱️</span>
          <h1 style="font-family: var(--font-display); font-size: 2.5rem; margin: 0; color: #ffffff; letter-spacing: 2px;">
            MINUTE TO WIN IT
          </h1>
        </div>
        <div style="font-family: var(--font-display); font-size: 3rem; color: #fef08a; margin-top: 12px;" id="challenge-name-tv">
          JUNK IN THE TRUNK
        </div>
        <p style="font-size: 1.6rem; color: #cbd5e1; line-height: 1.6; margin-top: 16px;" id="challenge-rules-tv">
          Shake 8 ping pong balls out of a tissue box strapped to your waist in under 60 seconds without using your hands!
        </p>
      </div>
    </div>
  </div>

  <script src="minutetowinit-spectator.js"></script>
</body>
</html>
