<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Who Wants to Be a Millionaire? - Mobile Follow Along</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;900&family=Teko:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      background: #020617;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .mobile-card {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .game-title {
      font-family: 'Teko', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: #fef08a;
      text-align: center;
      margin-bottom: 4px;
      letter-spacing: 2px;
    }
    .label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #94a3b8;
    }
    .value {
      font-family: 'Teko', sans-serif;
      font-size: 2.2rem;
      color: #ffffff;
      font-weight: 700;
    }
    .question-box {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.4;
      color: #ffffff;
      margin-top: 6px;
    }
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }
    .opt-card {
      padding: 12px 16px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.15);
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
      transition: all 0.2s ease;
    }
    .opt-card.selected {
      background: rgba(234, 179, 8, 0.25);
      border-color: #facc15;
      color: #fef08a;
      box-shadow: 0 0 15px rgba(250, 204, 21, 0.4);
    }
    .opt-card.correct {
      background: rgba(34, 197, 94, 0.35);
      border-color: #22c55e;
      color: #ffffff;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.5);
    }
    .opt-card.hidden {
      opacity: 0.15;
      visibility: hidden;
    }
    .lifelines-row {
      display: flex;
      justify-content: space-around;
      gap: 8px;
      margin-top: 8px;
    }
    .lifeline-pill {
      flex: 1;
      padding: 8px 4px;
      text-align: center;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
      border: 1px solid rgba(56, 189, 248, 0.4);
      background: rgba(2, 132, 199, 0.15);
      color: #38bdf8;
    }
    .lifeline-pill.used {
      opacity: 0.3;
      text-decoration: line-through;
      border-color: rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.3);
      color: #64748b;
    }
    .ladder-progress {
      font-family: 'Teko', sans-serif;
      font-size: 1.4rem;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="game-title">💡 MILLIONAIRE</div>
  
  <div class="mobile-card" style="display:flex; justify-content:space-between; align-items:center;">
    <div>
      <div class="label">CURRENT LEVEL</div>
      <div class="value" id="prize-val" style="color: #facc15;">$100</div>
    </div>
    <div style="text-align:right;">
      <div class="label">QUESTION</div>
      <div class="ladder-progress" id="q-progress">1 OF 15</div>
    </div>
  </div>

  <div class="mobile-card">
    <div class="label">QUESTION</div>
    <div class="question-box" id="question-text">Loading question...</div>
    <div class="options-grid">
      <div class="opt-card" id="opt-a">A: —</div>
      <div class="opt-card" id="opt-b">B: —</div>
      <div class="opt-card" id="opt-c">C: —</div>
      <div class="opt-card" id="opt-d">D: —</div>
    </div>
  </div>

  <div class="mobile-card">
    <div class="label">LIFELINES</div>
    <div class="lifelines-row">
      <div class="lifeline-pill" id="ll-5050">50 : 50</div>
      <div class="lifeline-pill" id="ll-audience">👥 AUDIENCE</div>
      <div class="lifeline-pill" id="ll-phone">📞 PHONE FRIEND</div>
    </div>
  </div>

  <script>
    const bc = new BroadcastChannel('millionaire_stage_broadcast');
    function render(state) {
      if (!state) return;
      const step = state.step !== undefined ? state.step : 0;
      document.getElementById('q-progress').textContent = `${step + 1} OF 15`;
      document.getElementById('prize-val').textContent = state.val || '$100';
      document.getElementById('question-text').textContent = state.text || '—';

      const hidden = new Set(state.hiddenOptions || []);
      const opts = [
        { key: 'A', el: document.getElementById('opt-a'), text: (state.options && state.options[0]) || 'A: Option A' },
        { key: 'B', el: document.getElementById('opt-b'), text: (state.options && state.options[1]) || 'B: Option B' },
        { key: 'C', el: document.getElementById('opt-c'), text: (state.options && state.options[2]) || 'C: Option C' },
        { key: 'D', el: document.getElementById('opt-d'), text: (state.options && state.options[3]) || 'D: Option D' }
      ];

      opts.forEach(o => {
        if (!o.el) return;
        o.el.textContent = o.text;
        o.el.className = 'opt-card';

        if (hidden.has(o.key)) {
          o.el.classList.add('hidden');
        }
        if (state.selectedOption === o.key) {
          o.el.classList.add('selected');
        }
        if (state.revealedCorrect && state.answer === o.key) {
          o.el.classList.add('correct');
        }
      });

      // Lifelines state
      const ll5050 = document.getElementById('ll-5050');
      if (ll5050) {
        if (hidden.size > 0) ll5050.classList.add('used');
        else ll5050.classList.remove('used');
      }
    }
    bc.onmessage = e => { if (e.data && e.data.type === 'SYNC_MILLIONAIRE_STATE') render(e.data.state); };
    try { const s = localStorage.getItem('millionaire_last_state'); if (s) render(JSON.parse(s)); } catch(_) {}
  </script>
</body>
</html>
