<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Who Wants to Be a Millionaire? - Live Stage TV Display</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Teko:wght@600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      overflow: hidden;
      margin: 0;
      background: #020617;
    }

    .spectator-container {
      display: grid;
      grid-template-columns: 1fr 340px;
      height: 100vh;
      width: 100vw;
      padding: 24px;
      box-sizing: border-box;
      gap: 24px;
    }

    .question-box-tv {
      background: rgba(15, 23, 42, 0.9);
      border: 3px solid var(--sky-blue);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      font-family: var(--font-display);
      font-size: 2.4rem;
      font-weight: 900;
      color: #ffffff;
      min-height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-neon);
    }

    .options-grid-tv {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 20px;
    }

    .opt-btn-tv {
      padding: 20px 24px;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.8);
      border: 3px solid var(--glass-border);
      color: #ffffff;
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 800;
      text-align: left;
      transition: all 0.3s ease;
    }

    .opt-btn-tv.selected {
      background: rgba(234, 179, 8, 0.3);
      border-color: #facc15;
      color: #fef08a;
      box-shadow: 0 0 25px rgba(250, 204, 21, 0.5);
    }

    .opt-btn-tv.correct {
      background: rgba(34, 197, 94, 0.4);
      border-color: #22c55e;
      color: #ffffff;
      box-shadow: 0 0 30px rgba(34, 197, 94, 0.6);
      animation: pulseGreen 1s infinite alternate;
    }

    @keyframes pulseGreen {
      0% { transform: scale(1); }
      100% { transform: scale(1.02); }
    }

    .opt-btn-tv.hidden-opt {
      visibility: hidden;
    }

    .ladder-tv {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 2px solid var(--glass-border);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column-reverse;
      gap: 6px;
    }

    .ladder-step-tv {
      display: flex;
      justify-content: space-between;
      padding: 6px 16px;
      border-radius: 8px;
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 800;
      color: #94a3b8;
    }

    .ladder-step-tv.milestone {
      color: #ffffff;
    }

    .ladder-step-tv.active {
      background: #facc15;
      color: #0f172a;
      box-shadow: 0 0 20px rgba(250, 204, 21, 0.6);
    }
  </style>
</head>
<body data-theme="runway-blue">
  <div class="stage-spotlight-left"></div>
  <div class="stage-spotlight-right"></div>

  <div class="spectator-container">
    <!-- Left Stage Main -->
    <div style="display: flex; flex-direction: column; justify-content: space-between;">
      <!-- Title Header -->
      <div style="display: flex; align-items: center; gap: 16px;">
        <span style="font-size: 3rem;">💡</span>
        <h1 style="font-family: var(--font-display); font-size: 2.8rem; margin: 0; color: #ffffff; letter-spacing: 3px;">
          WHO WANTS TO BE A MILLIONAIRE?
        </h1>
      </div>

      <!-- Question & Options Deck -->
      <div>
        <div class="question-box-tv" id="question-text-tv">
          Loading question 1 for $100...
        </div>

        <div class="options-grid-tv">
          <div class="opt-btn-tv" id="opt-a-tv">A: Option A</div>
          <div class="opt-btn-tv" id="opt-b-tv">B: Option B</div>
          <div class="opt-btn-tv" id="opt-c-tv">C: Option C</div>
          <div class="opt-btn-tv" id="opt-d-tv">D: Option D</div>
        </div>
      </div>
    </div>

    <!-- Right Money Ladder Sidebar TV -->
    <div class="ladder-tv" id="money-ladder-tv">
      <!-- 15 Steps generated dynamically -->
    </div>
  </div>

  <script src="millionaire-spectator.js"></script>
</body>
</html>
