<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Are You Smarter Than a 5th Grader? - Live Stage TV Display</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Teko:wght@600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      overflow: hidden;
      margin: 0;
      background: #020617;
    }

    .spectator-container {
      display: grid;
      grid-template-columns: 360px 1fr;
      height: 100vh;
      width: 100vw;
      padding: 24px;
      box-sizing: border-box;
      gap: 24px;
    }

    .chalkboard-grid-tv {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 3px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column-reverse;
      gap: 8px;
    }

    .grade-subject-tv {
      padding: 12px 18px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.7);
      border: 2px solid var(--glass-border);
      color: #ffffff;
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
    }

    .grade-subject-tv.active {
      background: #facc15;
      color: #0f172a;
      border-color: #fef08a;
      box-shadow: 0 0 25px rgba(250, 204, 21, 0.7);
    }

    .question-box-tv {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 3px solid var(--sky-blue);
      border-radius: 24px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow-neon);
    }
  </style>
</head>
<body data-theme="runway-blue">
  <div class="stage-spotlight-left"></div>
  <div class="stage-spotlight-right"></div>

  <div class="spectator-container">
    <!-- Left: 10 Subjects TV -->
    <div class="chalkboard-grid-tv" id="subject-grid-tv">
      <!-- Generated dynamically -->
    </div>

    <!-- Right: Question & Classmate TV -->
    <div class="question-box-tv">
      <div>
        <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 16px;">
          <span style="font-size: 3rem;">🎓</span>
          <h1 style="font-family: var(--font-display); font-size: 2.4rem; margin: 0; color: #ffffff; letter-spacing: 2px;">
            ARE YOU SMARTER THAN A 5TH GRADER?
          </h1>
        </div>

        <div style="font-family: var(--font-display); font-size: 1.8rem; color: var(--sky-blue);" id="active-subject-tv">
          1ST GRADE ANIMAL SCIENCE ($1,000)
        </div>

        <div style="font-family: var(--font-display); font-size: 2.6rem; color: #ffffff; margin-top: 16px;" id="question-text-tv">
          What is the only mammal capable of true flight?
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; border-top: 2px solid rgba(255,255,255,0.1); padding-top: 20px;">
        <div style="font-size: 1.4rem; color: #cbd5e1;">Classmate Helper: <strong id="classmate-tv" style="color: #fef08a;">ALEX</strong></div>
        <div style="font-size: 1.8rem; color: #34d399; font-weight: 900;" id="answer-text-tv"></div>
      </div>
    </div>

    <!-- Dropout Overlay -->
    <div id="dropout-overlay" style="display:none; position:fixed; inset:0; background:rgba(220,38,38,0.85); z-index:9000; align-items:center; justify-content:center; flex-direction:column; gap:16px;">
      <div style="font-family:'Teko',sans-serif; font-size:6rem; font-weight:900; color:#ffffff; text-align:center; text-shadow:0 0 40px rgba(255,255,255,0.5);">DROPPED OUT!</div>
      <div style="font-family:'Montserrat',sans-serif; font-size:2rem; color:#fef2f2;">"I am NOT smarter than a 5th grader!"</div>
    </div>
  </div>

  <script src="fifthgrader-spectator.js"></script>
</body>
</html>
